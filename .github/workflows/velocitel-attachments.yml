name: Velocitel public attachment-path probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  attachments:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Probe public RECAP and Internet Archive attachments
        run: python research/velocitel_attachment_probe.py

      - name: Upload attachment evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocitel-attachment-probe
          path: research-output/velocitel-attachment-probe/
          if-no-files-found: warn
          retention-days: 7
