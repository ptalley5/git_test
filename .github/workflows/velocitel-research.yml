name: Delta Oaks early website chronology

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Recover earliest Delta Oaks website language
        run: python research/dog_early_archive.py

      - name: Upload Delta Oaks chronology evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dog-early-archive
          path: research-output/dog-early-archive/
          if-no-files-found: warn
          retention-days: 7
