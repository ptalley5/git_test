name: Other Velocitel former-employee cases

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pypdf

      - name: Research other Velocitel former-employee cases
        run: python research/velocitel_other_cases.py

      - name: Upload other-case evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocitel-other-cases
          path: research-output/velocitel-other-cases/
          if-no-files-found: warn
          retention-days: 7
