name: FDH and Delta Oaks website archive trace

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Recover archived company service and technology pages
        run: python research/fdh_website_archive_compact.py

      - name: Upload website archive trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdh-website-archive
          path: research-output/fdh-website-archive/
          if-no-files-found: warn
          retention-days: 7
