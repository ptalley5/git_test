name: Delta Oaks patent and IP trace

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Search public patent and trademark indexes
        run: python research/dog_patent_trace.py

      - name: Upload Delta Oaks patent evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dog-patent-trace
          path: research-output/dog-patent-trace/
          if-no-files-found: warn
          retention-days: 7
