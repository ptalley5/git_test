name: FDH patent and technical trace

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Trace FDH patents and technical publications
        run: python research/fdh_patent_trace_compact.py

      - name: Upload patent trace
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdh-patent-trace
          path: research-output/fdh-patent-trace/
          if-no-files-found: warn
          retention-days: 7
