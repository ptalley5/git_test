name: Velocitel Justia filing-path probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Probe deterministic Justia document paths
        run: python research/velocitel_justia_probe.py

      - name: Upload Justia probe evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocitel-justia-probe
          path: research-output/velocitel-justia-probe/
          if-no-files-found: warn
          retention-days: 7
