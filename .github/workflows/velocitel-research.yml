name: Velocitel related-case research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pypdf

      - name: Research Velocitel companion and related cases
        run: python research/velocitel_related_cases.py

      - name: Upload related-case research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocitel-related-cases
          path: research-output/related-cases/
          if-no-files-found: warn
          retention-days: 7
