name: FDH public patent PDF extraction

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests pypdf

      - name: Download and extract FDH patent PDFs
        run: python research/fdh_patent_pdf_download.py

      - name: Upload patent PDFs and extracted text
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdh-patent-pdfs
          path: research-output/fdh-patent-pdfs/
          if-no-files-found: warn
          retention-days: 7
