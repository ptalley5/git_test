name: Velocitel free contact-route research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Find free contact and institutional access routes
        run: python research/velocitel_contacts.py

      - name: Upload contact-route research
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocitel-free-contact-routes
          path: research-output/free-contact-routes/
          if-no-files-found: warn
          retention-days: 7
