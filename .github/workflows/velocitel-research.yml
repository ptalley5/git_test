name: Delta Oaks corrected early archive

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml

      - name: Recover early Delta Oaks pages
        run: python research/dog_early_archive_fixed.py

      - name: Upload early Delta Oaks evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dog-early-archive-fixed
          path: research-output/dog-early-archive-fixed/
          if-no-files-found: warn
          retention-days: 7
