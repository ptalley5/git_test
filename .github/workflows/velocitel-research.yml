name: Velocitel exact public-archive probe

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml warcio

      - name: Probe exact public archive and crawl URLs
        run: python research/velocitel_exact_archive.py

      - name: Upload exact archive evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocitel-exact-archive
          path: research-output/velocitel-exact-archive/
          if-no-files-found: warn
          retention-days: 7
