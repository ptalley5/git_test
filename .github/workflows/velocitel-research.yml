name: Velocitel public docket research

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pypdf

      - name: Collect and analyze public records
        run: |
          python research/velocitel_docket_research.py
          python research/velocitel_followup.py

      - name: Upload research evidence bundle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocitel-public-records
          path: research-output/
          if-no-files-found: warn
          retention-days: 7
