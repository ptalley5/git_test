name: FDH technical trace

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml pypdf
      - run: python research/fdh_technical_trace.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fdh-technical-trace
          path: fdh-technical-trace-output/
          if-no-files-found: warn
          retention-days: 7
