name: Convert KY00902 DXF to DWG

on:
  pull_request:
    branches: [main]
    paths: [.github/workflows/convert-ky00902-dwg.yml]

permissions:
  contents: read

jobs:
  convert:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Convert and validate
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $b64 = ''
          $gz = "$env:RUNNER_TEMP\input.dxf.gz"
          $dxf = "$env:GITHUB_WORKSPACE\KY00902-A_Antenna_Location_Comparison_EX-1.dxf"
          [IO.File]::WriteAllBytes($gz,[Convert]::FromBase64String($b64))
          $i=[IO.File]::OpenRead($gz); $o=[IO.File]::Create($dxf)
          try { $z=[IO.Compression.GzipStream]::new($i,[IO.Compression.CompressionMode]::Decompress); try{$z.CopyTo($o)}finally{$z.Dispose()} } finally{$o.Dispose();$i.Dispose()}
          if((Get-Item $dxf).Length -lt 50000){throw 'DXF recreation failed'}

          $h=@{'User-Agent'='KY00902-DWG-Conversion'}
          $r=Invoke-RestMethod 'https://api.github.com/repos/LibreDWG/libredwg/releases/tags/0.14' -Headers $h
          $a=$r.assets|Where-Object{$_.name -match '(?i)win64.*\.zip$'}|Select-Object -First 1
          if(-not $a){$a=$r.assets|Where-Object{$_.name -match '(?i)(windows|mingw).*64.*\.zip$'}|Select-Object -First 1}
          if(-not $a){throw 'LibreDWG Win64 release asset not found'}
          $zip="$env:RUNNER_TEMP\libredwg.zip"; $dir="$env:RUNNER_TEMP\libredwg"
          Invoke-WebRequest $a.browser_download_url -OutFile $zip -Headers $h
          Expand-Archive $zip $dir -Force
          $c=Get-ChildItem $dir -Recurse -Filter dxf2dwg.exe|Select-Object -First 1
          if(-not $c){throw 'dxf2dwg.exe not found'}
          $dwg="$env:GITHUB_WORKSPACE\KY00902-A_Antenna_Location_Comparison_EX-1.dwg"
          Push-Location $c.Directory.FullName
          try{& $c.FullName --as r2000 -y -o $dwg $dxf; $ec=$LASTEXITCODE}finally{Pop-Location}
          if($ec -ne 0 -or -not(Test-Path $dwg)){throw "Conversion failed: $ec"}
          $bytes=[IO.File]::ReadAllBytes($dwg); $hdr=[Text.Encoding]::ASCII.GetString($bytes,0,6)
          if($bytes.Length -lt 10000 -or $hdr -ne 'AC1015'){throw "Invalid DWG: $hdr / $($bytes.Length) bytes"}
          "Header=$hdr`nBytes=$($bytes.Length)`nSHA256=$((Get-FileHash $dwg -Algorithm SHA256).Hash)`nConverterAsset=$($a.name)"|Set-Content "$env:GITHUB_WORKSPACE\CONVERSION_REPORT.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: KY00902-A-DWG
          path: |
            KY00902-A_Antenna_Location_Comparison_EX-1.dwg
            CONVERSION_REPORT.txt
          retention-days: 1
