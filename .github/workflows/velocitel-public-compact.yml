name: Velocitel compact public-upload search

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4 lxml
      - run: python research/velocitel_public_uploads_compact.py
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocitel-public-uploads-compact
          path: research-output/velocitel-public-uploads-compact/
          if-no-files-found: warn
          retention-days: 7
